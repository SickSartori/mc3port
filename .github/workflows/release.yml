# Builds the Windows package on every push to main or develop and on pull requests. A tag vX.Y.Z (matching the
# version in CMakeLists.txt, with a section in CHANGELOG.md) makes it a draft GitHub release with its SHA256SUMS and
# notes, published by hand once its files are checked (VirusTotal); any other run keeps the package as an artifact, so a broken build shows up before a release.
name: Release

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # The shared runtime is the public submodule SickSartori/xport.
        with:
          submodules: recursive

      # Before the build: a tag that does not match the version, or a version without its CHANGELOG section, fails in
      # seconds instead of after the package is made.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(mc3port VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version") { throw "tag ${{ github.ref_name }} but CMakeLists.txt says $version" }
          ./tools/release_notes.ps1 -Version $version -Out notes.md

      - name: Install Inno Setup (for the installer)
        run: choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y

      - name: Build and package
        shell: pwsh
        run: ./tools/package.ps1

      # The 64-bit helper for DLSS (external/xport/tools/upscale64), so that a change that breaks it shows up here.
      # NVIDIA's DLSS SDK at a fixed version (310.9.16), only what the build needs: headers, the static NGX library and
      # the licence (4 MB). Not in the package: the game does not use the helper yet
      # (sick-xport docs/UPSCALING-DLSS-FSR.md).
      - name: Build the DLSS helper
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout --quiet https://github.com/NVIDIA/DLSS.git ../dlss-sdk
          git -C ../dlss-sdk sparse-checkout set --no-cone /include/ /lib/Windows_x86_64/x64/nvsdk_ngx_s.lib /LICENSE.txt
          git -C ../dlss-sdk checkout --quiet 9981c6350dc58c0ce21f024fd65e31e851c31689
          cmake -S external/xport/tools/upscale64 -B build/upscale64 -A x64 "-DDLSS_SDK=$((Resolve-Path ../dlss-sdk).Path)"
          if ($LASTEXITCODE) { throw "configure failed" }
          cmake --build build/upscale64 --config Release
          if ($LASTEXITCODE) { throw "build failed" }

      - name: Make the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes: the version's section of CHANGELOG.md (notes.md, made in the first check), then GitHub's
        # compare link.
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist -File).FullName --title "mc3port ${{ github.ref_name }}" --notes-file notes.md --generate-notes --draft

      - name: Keep the package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mc3port-windows
          path: |
            dist/*.zip
            dist/*.tar.gz

      # The helper alone, without NVIDIA's DLL (which goes out only inside a package, with its licence beside it).
      - name: Keep the DLSS helper
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mc3port-upscale64
          path: build/upscale64/Release/upscale64.exe
